[project]
name = "bgg-crawler"
version = "0.1.0"
description = "Statistically-driven board game design-space search using BoardGameGeek data"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1",
    "httpx>=0.27",
    "lxml>=5.0",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
notebooks = ["jupyterlab>=4.2", "matplotlib>=3.9"]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pyright]
# Resolve imports against the project venv, not the system interpreter.
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
include = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
